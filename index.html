<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RentIt | Rental Management</title>
<style>
:root{--blue:#1764e8;--blue-dark:#104fc0;--ink:#172642;--muted:#72809a;--line:#e5ebf4;--bg:#f5f8fd;--green:#d9f8e4;--green-ink:#16743a;--pale:#e5efff;--shadow:0 8px 24px rgba(20,50,100,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:235px;background:white;border-right:1px solid var(--line);padding:25px 15px;display:flex;flex-direction:column;z-index:5}.brand{font-size:24px;font-weight:850;letter-spacing:-1px;display:flex;align-items:center;gap:10px;margin:0 8px 36px}.brandmark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#3191ff,#1055d6);display:grid;place-items:center;color:white;font-size:20px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#53617a;text-align:left;padding:12px 13px;border-radius:9px;font-size:14px;display:flex;align-items:center;gap:12px}.nav button.active,.nav button:hover{background:var(--blue);color:#fff}.nav .ico{width:20px;text-align:center;font-size:17px}.logout{margin-top:auto!important}.main{margin-left:235px;padding:0 30px 35px}.topbar{height:78px;display:flex;align-items:center;gap:20px}.search{flex:1;max-width:570px;position:relative}.search input{width:100%;border:1px solid var(--line);background:white;border-radius:10px;padding:12px 15px 12px 42px;outline:none}.search:before{content:"⌕";position:absolute;left:15px;top:7px;font-size:25px;color:#8a98ae}.top-actions{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:13px}.avatar{width:35px;height:35px;border-radius:50%;background:#dce9ff;color:#174eaa;display:grid;place-items:center;font-weight:800}.profile{display:flex;align-items:center;gap:9px}.profile small{display:block;color:var(--muted);margin-top:3px}.mobile-menu{display:none;border:0;background:white;border-radius:8px;padding:9px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:8px 0 24px}.page-head h1{font-size:26px;margin:0 0 7px;letter-spacing:-.6px}.page-head p{color:var(--muted);margin:0;font-size:14px}.primary,.secondary,.danger{border:0;border-radius:9px;padding:11px 15px;font-weight:650;font-size:13px}.primary{background:var(--blue);color:white;box-shadow:0 5px 12px #1764e822}.primary:hover{background:var(--blue-dark)}.secondary{background:white;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0f0;color:#b42318}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:27px}.stat,.panel,.property-card,.table-panel{background:white;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:18px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.stat-icon{width:36px;height:36px;border-radius:11px;background:var(--pale);color:var(--blue);display:grid;place-items:center;font-size:18px}.stat strong{display:block;font-size:28px;margin:13px 0 5px;letter-spacing:-.5px}.stat small{color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 0 15px}.section-title h2{font-size:18px;margin:0}.text-link{border:0;background:none;color:var(--blue);font-weight:650;font-size:13px}.property-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.property-card{overflow:hidden}.property-photo{height:150px;display:grid;place-items:center;font-size:50px;color:#fff;background:linear-gradient(135deg,#b9d8f7,#edf5ff);position:relative}.property-photo.house{background:linear-gradient(140deg,#d3e9d1,#8fbf98)}.property-photo.apartment{background:linear-gradient(140deg,#e7d9ca,#a7bfd5)}.property-photo.studio{background:linear-gradient(140deg,#f0d9bd,#d2ddec)}.property-photo.villa{background:linear-gradient(140deg,#c9e7dc,#80bba5)}.property-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(16,37,65,.12),transparent 60%)}.property-content{padding:15px}.property-content h3{margin:0 0 8px;font-size:16px}.location{font-size:12px;color:var(--muted);margin-bottom:12px}.price{font-size:17px;font-weight:800}.price span{font-size:12px;font-weight:400;color:var(--muted)}.card-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.status{display:inline-flex;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:700;background:var(--green);color:var(--green-ink)}.status.occupied{background:var(--pale);color:#1758c8}.status.pending{background:#fff0cf;color:#8b5b00}.card-actions{display:flex;gap:7px}.card-actions button{padding:7px 10px;font-size:12px}.panel{padding:20px}.activity-list{display:grid;gap:0}.activity{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.activity:last-child{border:0}.activity-icon{width:38px;height:38px;border-radius:12px;background:#eef4ff;display:grid;place-items:center}.activity-text{flex:1}.activity-text strong{font-size:13px;display:block}.activity-text small{font-size:12px;color:var(--muted);display:block;margin-top:4px}.activity time{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select{padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:white;outline:none}.toolbar input{flex:1;min-width:180px}.table-panel{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:650px}.data-table th,.data-table td{text-align:left;padding:15px 17px;border-bottom:1px solid var(--line);font-size:13px}.data-table th{background:#fbfcff;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}.data-table tr:last-child td{border:0}.tenant-cell{display:flex;align-items:center;gap:10px}.mini-avatar{width:32px;height:32px;border-radius:50%;background:#e5efff;color:#1758c8;display:grid;place-items:center;font-weight:800}.hidden{display:none!important}.empty{text-align:center;padding:38px;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:#12203b77;display:grid;place-items:center;padding:18px;z-index:20}.modal{background:white;border-radius:15px;width:min(520px,100%);padding:24px;box-shadow:0 20px 70px #0b1e3b44}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modal-head h2{margin:0;font-size:20px}.close{border:0;background:#f1f4f9;border-radius:8px;padding:7px 10px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#53617a}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;outline:none}.field textarea{resize:vertical;min-height:70px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;right:22px;bottom:22px;background:#13284b;color:white;padding:13px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:30;font-size:13px}.footer-note{font-size:11px;color:#98a4b7;text-align:center;margin-top:30px}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.property-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:0 22px 30px}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:translateX(0);box-shadow:0 0 0 100vmax #12203b55}.main{margin-left:0;padding:0 15px 25px}.mobile-menu{display:block}.topbar{gap:10px;height:70px}.top-actions .profile div:not(.avatar){display:none}.page-head{align-items:flex-start}.page-head h1{font-size:22px}.stats{gap:10px}.stat{padding:14px}.stat strong{font-size:24px}.property-grid{grid-template-columns:1fr}.property-photo{height:180px}.page-head .primary{white-space:nowrap}.search input{padding-left:34px}.top-actions{gap:8px}}
@media(max-width:400px){.stats{grid-template-columns:1fr 1fr}.stat-top{font-size:11px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.page-head{flex-direction:column}.page-head .primary{width:100%}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="brandmark">⌂</span> RentIt</div>
  <nav class="nav" id="nav">
    <button class="active" data-page="Dashboard"><span class="ico">▦</span> Dashboard</button>
    <button data-page="Properties"><span class="ico">⌂</span> Properties</button>
    <button data-page="Applications"><span class="ico">▤</span> Applications</button>
    <button data-page="Tenants"><span class="ico">♙</span> Tenants</button>
    <button data-page="Messages"><span class="ico">✉</span> Messages</button>
    <button data-page="Reports"><span class="ico">▥</span> Reports</button>
    <button data-page="Settings"><span class="ico">⚙</span> Settings</button>
  </nav>
  <button class="nav logout" id="logout" style="text-align:left;border:0;background:transparent;color:#53617a;padding:12px">↪ &nbsp; Log out</button>
</aside>
<main class="main">
  <header class="topbar">
    <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
    <div class="search"><input id="globalSearch" placeholder="Search properties, tenants, or locations..." aria-label="Search"></div>
    <div class="top-actions"><span title="Notifications">♧</span><div class="profile"><div class="avatar">JI</div><div><strong>Jasper Intacto</strong><small>Administrator</small></div></div></div>
  </header>
  <div id="pageContent"></div>
  <div class="footer-note">RentIt Rental Management · Student mock website · Demo data only</div>
</main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const properties = [
 {id:1,name:"Maple Residence",location:"Poblacion, San Ildefonso, Bulacan",price:8000,status:"Available",type:"House",beds:3,baths:2,area:100,emoji:"⌂",style:"house",description:"A cozy and spacious home in a peaceful neighborhood, close to schools, markets, and public transportation."},
 {id:2,name:"Sunrise Apartment",location:"Baliwag, Bulacan",price:12000,status:"Occupied",type:"Apartment",beds:2,baths:1,area:75,emoji:"▤",style:"apartment",description:"Bright apartment with a comfortable living area and convenient access to shops and transport."},
 {id:3,name:"Greenview House",location:"San Rafael, Bulacan",price:10000,status:"Available",type:"House",beds:3,baths:2,area:95,emoji:"⌂",style:"villa",description:"A family-friendly home with a garden and a quiet residential setting."},
 {id:4,name:"City Studio",location:"Malolos, Bulacan",price:15000,status:"Occupied",type:"Studio",beds:1,baths:1,area:42,emoji:"▦",style:"studio",description:"Modern studio space suited for students and working professionals."},
 {id:5,name:"Riverside House",location:"San Miguel, Bulacan",price:9000,status:"Available",type:"House",beds:2,baths:1,area:80,emoji:"⌂",style:"house",description:"Simple, airy house with a relaxing outdoor space."},
 {id:6,name:"Parkside Condo",location:"Meycauayan, Bulacan",price:13500,status:"Maintenance",type:"Condo",beds:2,baths:1,area:60,emoji:"▥",style:"apartment",description:"Practical condominium unit near everyday essentials."}
];
let tenants = [
 {id:1,name:"Juan Dela Cruz",property:"Sunrise Apartment",email:"juan@example.com",phone:"0917 123 4567",status:"Active"},
 {id:2,name:"Maria Santos",property:"City Studio",email:"maria@example.com",phone:"0918 234 5678",status:"Active"},
 {id:3,name:"Carlo Reyes",property:"—",email:"carlo@example.com",phone:"0919 345 6789",status:"Pending"}
];
let applications = [
 {id:1,name:"Angela Mendoza",property:"Maple Residence",date:"Oct 12, 2026",status:"Pending"},
 {id:2,name:"Paolo Garcia",property:"Riverside House",date:"Oct 10, 2026",status:"Approved"},
 {id:3,name:"Sofia Ramos",property:"Greenview House",date:"Oct 08, 2026",status:"Reviewing"}
];
let currentPage="Dashboard", propertyFilter="All", propertySearch="";
const money=n=>"₱"+Number(n).toLocaleString("en-PH");
function statusBadge(s){let c=s==="Available"||s==="Active"||s==="Approved"?"":s==="Occupied"?"occupied":"pending";return `<span class="status ${c}">${s}</span>`}
function head(title,sub,button=""){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}
function stat(title,num,icon,note){return `<div class="stat"><div class="stat-top">${title}<span class="stat-icon">${icon}</span></div><strong>${num}</strong><small>${note}</small></div>`}
function propertyCard(p){return `<article class="property-card"><div class="property-photo ${p.style}">${p.emoji}</div><div class="property-content"><h3>${p.name}</h3><div class="location">⌖ ${p.location}</div><div class="price">${money(p.price)} <span>/ month</span></div><div class="card-bottom">${statusBadge(p.status)}<div class="card-actions"><button class="secondary" onclick="viewProperty(${p.id})">Details</button><button class="secondary" onclick="editProperty(${p.id})">Edit</button></div></div></div></article>`}
function dashboard(){let occupied=properties.filter(p=>p.status==="Occupied").length, available=properties.filter(p=>p.status==="Available").length;
return `${head("Welcome back, Jasper!","Here’s what’s happening with your rental properties.",'<button class="primary" onclick="openPropertyModal()">＋ Add Property</button>')}
<div class="stats">${stat("Total Properties",properties.length,"⌂","Across your portfolio")}${stat("Occupied",occupied,"♙","Currently rented")}${stat("Vacant",available,"⌘","Ready for tenants")}${stat("Pending Applications",applications.filter(a=>a.status==="Pending").length,"▤","Need your attention")}</div>
<div class="section-title"><h2>Recent Properties</h2><button class="text-link" onclick="go('Properties')">View all →</button></div><div class="property-grid">${properties.slice(0,3).map(propertyCard).join("")}</div>
<div class="section-title"><h2>Recent Activity</h2><button class="text-link" onclick="go('Applications')">View applications →</button></div>
<div class="panel activity-list"><div class="activity"><div class="activity-icon">▤</div><div class="activity-text"><strong>New rental application received</strong><small>Angela Mendoza applied for Maple Residence</small></div><time>Today</time></div><div class="activity"><div class="activity-icon">₱</div><div class="activity-text"><strong>Monthly rent reminder</strong><small>Remember to review tenant payment records</small></div><time>Yesterday</time></div><div class="activity"><div class="activity-icon">⌂</div><div class="activity-text"><strong>Property listing updated</strong><small>Riverside House details are up to date</small></div><time>Oct 10</time></div></div>`}
function propertiesPage(){let list=properties.filter(p=>(propertyFilter==="All"||p.status===propertyFilter)&&(`${p.name} ${p.location} ${p.type}`).toLowerCase().includes(propertySearch.toLowerCase()));
return `${head("Properties","Manage your rental listings and availability.",'<button class="primary" onclick="openPropertyModal()">＋ Add Property</button>')}<div class="toolbar"><input id="propertySearch" placeholder="Search by property or location..." value="${propertySearch.replace(/"/g,'&quot;')}"><select id="propertyFilter"><option ${propertyFilter==="All"?"selected":""}>All</option><option ${propertyFilter==="Available"?"selected":""}>Available</option><option ${propertyFilter==="Occupied"?"selected":""}>Occupied</option><option ${propertyFilter==="Maintenance"?"selected":""}>Maintenance</option></select></div><div class="property-grid">${list.map(propertyCard).join("")||'<div class="empty">No properties match your search.</div>'}</div>`}
function tenantsPage(){return `${head("Tenants","Keep tenant information organized.",'<button class="primary" onclick="openTenantModal()">＋ Add Tenant</button>')}<div class="toolbar"><input id="tenantSearch" placeholder="Search tenants..." /></div><div class="table-panel"><table class="data-table"><thead><tr><th>Tenant</th><th>Property</th><th>Email</th><th>Phone</th><th>Status</th><th>Action</th></tr></thead><tbody id="tenantRows">${tenantRows(tenants)}</tbody></table></div>`}
function tenantRows(list){return list.map(t=>`<tr><td><div class="tenant-cell"><span class="mini-avatar">${t.name.split(" ").map(x=>x[0]).slice(0,2).join("")}</span><strong>${t.name}</strong></div></td><td>${t.property}</td><td>${t.email}</td><td>${t.phone}</td><td>${statusBadge(t.status)}</td><td><button class="secondary" onclick="notify('Tenant record opened (demo).')">View</button></td></tr>`).join("")||'<tr><td colspan="6" class="empty">No tenants found.</td></tr>'}
function applicationsPage(){return `${head("Applications","Review and manage rental applications.")}<div class="table-panel"><table class="data-table"><thead><tr><th>Applicant</th><th>Property</th><th>Date submitted</th><th>Status</th><th>Actions</th></tr></thead><tbody>${applications.map(a=>`<tr><td><strong>${a.name}</strong></td><td>${a.property}</td><td>${a.date}</td><td>${statusBadge(a.status)}</td><td><button class="secondary" onclick="changeApplication(${a.id},'Approved')">Approve</button> <button class="secondary" onclick="changeApplication(${a.id},'Reviewing')">Review</button></td></tr>`).join("")}</tbody></table></div>`}
function messagesPage(){return `${head("Messages","A simple place to track rental conversations.")}<div class="panel activity-list"><div class="activity"><div class="activity-icon">♙</div><div class="activity-text"><strong>Juan Dela Cruz</strong><small>Hello! I would like to confirm the rent due date for this month.</small></div><button class="secondary" onclick="notify('Demo reply: Thanks for reaching out. We will confirm shortly.')">Reply</button></div><div class="activity"><div class="activity-icon">♙</div><div class="activity-text"><strong>Angela Mendoza</strong><small>Is Maple Residence still available for viewing?</small></div><button class="secondary" onclick="notify('Demo reply: Yes, the listing is available.')">Reply</button></div><div class="activity"><div class="activity-icon">♙</div><div class="activity-text"><strong>Maria Santos</strong><small>I have sent my maintenance request.</small></div><button class="secondary" onclick="notify('Maintenance message marked as reviewed.')">View</button></div></div>`}
function reportsPage(){let income=properties.filter(p=>p.status==="Occupied").reduce((s,p)=>s+p.price,0);return `${head("Reports","A quick overview of your rental portfolio.")}<div class="stats">${stat("Potential monthly rent",money(properties.reduce((s,p)=>s+p.price,0)),"₱","If every property is rented")}${stat("Current occupied rent",money(income),"↗","Based on occupied listings")}${stat("Occupancy rate",Math.round(properties.filter(p=>p.status==="Occupied").length/properties.length*100)+"%","▥","Of listed properties")}${stat("Active tenants",tenants.filter(t=>t.status==="Active").length,"♙","Current tenant records")}</div><div class="panel"><h2>Portfolio summary</h2><p style="color:var(--muted);line-height:1.7">This report uses sample data for demonstration. It is not connected to a real payment system or database.</p><button class="secondary" onclick="window.print()">Print this report</button></div>`}
function settingsPage(){return `${head("Settings","Customize your demo account.")}<div class="panel" style="max-width:650px"><h2>Profile information</h2><div class="form-grid"><div class="field"><label>Display name</label><input value="Jasper Intacto" id="settingName"></div><div class="field"><label>Role</label><input value="Administrator" disabled></div><div class="field full"><label>Email address</label><input value="jasper@example.com" id="settingEmail"></div></div><div style="margin-top:18px"><button class="primary" onclick="notify('Demo profile settings saved.')">Save Changes</button></div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>Demo settings</h3><p style="color:var(--muted);font-size:13px">This mock website stores changes only in the current browser session. It does not include a backend or real user authentication.</p></div>`}
function go(page){currentPage=page;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render();document.getElementById("sidebar").classList.remove("open")}
function render(){const el=document.getElementById("pageContent");const pages={Dashboard:dashboard,Properties:propertiesPage,Applications:applicationsPage,Tenants:tenantsPage,Messages:messagesPage,Reports:reportsPage,Settings:settingsPage};el.innerHTML=(pages[currentPage]||dashboard)();if(currentPage==="Properties"){document.getElementById("propertySearch").addEventListener("input",e=>{propertySearch=e.target.value;const pos=e.target.selectionStart;render();let n=document.getElementById("propertySearch");n.focus();n.setSelectionRange(pos,pos)});document.getElementById("propertyFilter").addEventListener("change",e=>{propertyFilter=e.target.value;render()})}if(currentPage==="Tenants"){document.getElementById("tenantSearch").addEventListener("input",e=>{let q=e.target.value.toLowerCase();document.getElementById("tenantRows").innerHTML=tenantRows(tenants.filter(t=>(t.name+t.property+t.email).toLowerCase().includes(q)))}}}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
document.getElementById("mobileMenu").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){propertySearch=e.target.value;go("Properties")}});
document.getElementById("logout").addEventListener("click",()=>notify("This is a demo. No account is connected."));
function notify(msg){const root=document.getElementById("toastRoot");root.innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>root.innerHTML="",2800)}
function viewProperty(id){const p=properties.find(x=>x.id===id);document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${p.name}</h2><button class="close" onclick="closeModal()">✕</button></div><div class="property-photo ${p.style}" style="border-radius:10px;margin-bottom:18px">${p.emoji}</div><p style="color:var(--muted)">⌖ ${p.location}</p><h2>${money(p.price)} <span style="font-size:13px;color:var(--muted);font-weight:400">/ month</span></h2><p>${p.description}</p><p>🛏 ${p.beds} bedrooms &nbsp; · &nbsp; 🛁 ${p.baths} bathrooms &nbsp; · &nbsp; ▧ ${p.area} sqm</p><p>${statusBadge(p.status)}</p><div class="modal-actions"><button class="secondary" onclick="closeModal()">Close</button><button class="primary" onclick="closeModal();editProperty(${p.id})">Edit Property</button></div></div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function openPropertyModal(id=null){const p=id?properties.find(x=>x.id===id):null;document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><form class="modal" onsubmit="saveProperty(event,${id||"null"})"><div class="modal-head"><h2>${p?"Edit Property":"Add New Property"}</h2><button type="button" class="close" onclick="closeModal()">✕</button></div><div class="form-grid"><div class="field full"><label>Property name *</label><input name="name" required value="${p?.name||""}" placeholder="e.g. Maple Residence"></div><div class="field full"><label>Location *</label><input name="location" required value="${p?.location||""}" placeholder="City, Province"></div><div class="field"><label>Monthly rent (₱) *</label><input name="price" type="number" min="1" required value="${p?.price||""}"></div><div class="field"><label>Property type</label><select name="type">${["House","Apartment","Studio","Condo"].map(t=>`<option ${p?.type===t?"selected":""}>${t}</option>`).join("")}</select></div><div class="field"><label>Status</label><select name="status">${["Available","Occupied","Maintenance"].map(t=>`<option ${p?.status===t?"selected":""}>${t}</option>`).join("")}</select></div><div class="field"><label>Bedrooms</label><input name="beds" type="number" min="0" value="${p?.beds??2}"></div><div class="field"><label>Bathrooms</label><input name="baths" type="number" min="0" value="${p?.baths??1}"></div><div class="field"><label>Area (sqm)</label><input name="area" type="number" min="0" value="${p?.area??60}"></div><div class="field full"><label>Description</label><textarea name="description">${p?.description||""}</textarea></div></div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary" type="submit">Save Property</button></div></form></div>`}
function editProperty(id){openPropertyModal(id)}
function saveProperty(e,id){e.preventDefault();const f=new FormData(e.target);const data={name:f.get("name").trim(),location:f.get("location").trim(),price:Number(f.get("price")),type:f.get("type"),status:f.get("status"),beds:Number(f.get("beds")),baths:Number(f.get("baths")),area:Number(f.get("area")),description:f.get("description"),emoji:f.get("type")==="Apartment"?"▤":f.get("type")==="Studio"?"▦":"⌂",style:f.get("type")==="Apartment"?"apartment":f.get("type")==="Studio"?"studio":"house"};if(id){Object.assign(properties.find(p=>p.id===id),data);notify("Property updated.")}else{data.id=Math.max(0,...properties.map(p=>p.id))+1;properties.unshift(data);notify("Property added.")}closeModal();render()}
function openTenantModal(){document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><form class="modal" onsubmit="saveTenant(event)"><div class="modal-head"><h2>Add Tenant</h2><button type="button" class="close" onclick="closeModal()">✕</button></div><div class="form-grid"><div class="field full"><label>Full name *</label><input name="name" required></div><div class="field full"><label>Email *</label><input name="email" type="email" required></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Property</label><select name="property"><option>—</option>${properties.map(p=>`<option>${p.name}</option>`).join("")}</select></div></div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save Tenant</button></div></form></div>`}
function saveTenant(e){e.preventDefault();const f=new FormData(e.target);tenants.push({id:Math.max(0,...tenants.map(t=>t.id))+1,name:f.get("name"),email:f.get("email"),phone:f.get("phone")||"—",property:f.get("property"),status:"Active"});closeModal();render();notify("Tenant added to demo list.")}
function changeApplication(id,status){const a=applications.find(x=>x.id===id);a.status=status;render();notify(`Application marked ${status.toLowerCase()}.`)}
render();
</script>
</body>
</html>
